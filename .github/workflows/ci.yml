# TEMPLATE – not verified against the real repository.
# MB-SET-002 must replace the steps below with the scripts that actually exist in package.json.
# `--if-present` skips a missing script silently; remove it for required checks once scripts exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]   # adjust to the real default branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # adjust to the project's engines field
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
