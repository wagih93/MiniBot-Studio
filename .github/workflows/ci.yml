name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Print unit test count
        run: |
          node --test "tests/unit/**/*.test.js" > /tmp/unit-tests.log 2>&1
          grep -E "ℹ tests [0-9]+" /tmp/unit-tests.log | tail -n 1
      - run: npm run check
