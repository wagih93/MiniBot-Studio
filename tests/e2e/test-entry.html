<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    >
    <title>MiniBot Studio - Robot Lab</title>
    <link rel="stylesheet" href="../../css/app.css">
    <script type="module" src="./test-entry.js"></script>
  </head>
  <body>
    <main class="robot-lab" aria-label="مختبر الروبوت">
      <header class="robot-lab__header">
        <h1 id="app-heading"></h1>
        <p id="level-indicator" class="level-indicator"></p>
      </header>
      <nav class="primary-actions" role="navigation" aria-label="القائمة الرئيسية">
        <button id="start-button" type="button">
          <span class="primary-action-icon" aria-hidden="true">▶️</span>
          <span id="start-button-label"></span>
        </button>
        <button id="continue-button" type="button">
          <span class="primary-action-icon" aria-hidden="true">📘</span>
          <span id="continue-button-label"></span>
        </button>
        <button id="parents-button" type="button">
          <span class="primary-action-icon" aria-hidden="true">👪</span>
          <span id="parents-button-label"></span>
        </button>
        <button id="tutorial-button" type="button">
          <span class="primary-action-icon" aria-hidden="true">❓</span>
          <span id="tutorial-button-label"></span>
        </button>
        <button id="lab-button" type="button">
          <span class="primary-action-icon" aria-hidden="true">🧪</span>
          <span id="lab-button-label"></span>
        </button>
      </nav>
      <section id="parent-area" class="parent-area" hidden aria-live="polite">
        <h2 id="parent-area-heading"></h2>
        <p id="parent-area-description"></p>
        <label class="parent-area__toggle" for="sound-effects-toggle">
          <input id="sound-effects-toggle" type="checkbox">
          <span id="sound-effects-label"></span>
        </label>
        <p id="parent-progress-summary" class="parent-area__summary"></p>
        <ul id="parent-concept-list" class="parent-area__concepts"></ul>
        <div class="parent-area__actions">
          <button id="clear-progress-button" type="button"></button>
          <button id="close-parent-area-button" type="button"></button>
        </div>
      </section>
      <section id="tutorial-panel" class="tutorial-panel" hidden aria-live="polite">
        <p id="tutorial-step-indicator" class="tutorial-panel__step"></p>
        <h2 id="tutorial-heading" class="tutorial-panel__heading"></h2>
        <p id="tutorial-body" class="tutorial-panel__body"></p>
        <div class="tutorial-panel__actions">
          <button id="tutorial-audio-button" type="button"></button>
          <button id="tutorial-next-button" type="button"></button>
          <button id="tutorial-skip-button" type="button"></button>
          <button id="tutorial-close-button" type="button"></button>
        </div>
      </section>
      <div class="workspace">
        <section id="robot-world" class="panel world-panel" aria-label="عالم الروبوت">
          <h2 id="world-heading"></h2>
          <div id="world-grid" class="world-grid" role="img" aria-label="شبكة الروبوت"></div>
          <section id="lab-controls" class="lab-controls" hidden>
            <h3 id="lab-controls-heading"></h3>
            <div class="lab-controls__actions">
              <button id="lab-mode-robot-button" type="button"></button>
              <button id="lab-mode-obstacle-button" type="button"></button>
            </div>
          </section>
          <section id="robot-customization" class="robot-customization">
            <h3 id="robot-customization-heading"></h3>
            <div class="robot-customization__group">
              <p id="robot-design-heading"></p>
              <div class="robot-customization__options" role="group" aria-labelledby="robot-design-heading">
                <button id="robot-design-classic-button" type="button" data-robot-design="classic"></button>
                <button id="robot-design-explorer-button" type="button" data-robot-design="explorer"></button>
                <button id="robot-design-turbo-button" type="button" data-robot-design="turbo"></button>
              </div>
            </div>
            <div class="robot-customization__group">
              <p id="robot-color-heading"></p>
              <div class="robot-customization__options" role="group" aria-labelledby="robot-color-heading">
                <button id="robot-color-blue-button" type="button" data-robot-color="blue"></button>
                <button id="robot-color-green-button" type="button" data-robot-color="green"></button>
                <button id="robot-color-purple-button" type="button" data-robot-color="purple"></button>
              </div>
            </div>
          </section>
          <p id="collection-summary" class="level-meta"></p>
          <p id="sensor-state" class="level-meta"></p>
          <p id="level-hint" class="level-meta"></p>
          <button id="hint-button" type="button" class="hint-button"></button>
          <button id="play-instruction-audio-button" type="button" class="hint-button"></button>
          <p id="success-condition" class="level-meta"></p>
        </section>
        <section id="block-area" class="panel block-panel" aria-label="منطقة الأوامر">
          <h2 id="block-area-heading"></h2>
          <div id="block-list" class="block-list" role="group" aria-label="أوامر الحركة"></div>
          <section id="program-workspace" class="program-workspace" aria-label="مساحة البرنامج">
            <h3 id="program-heading"></h3>
            <div class="program-actions">
              <button id="save-program-button" type="button"></button>
            </div>
            <ol id="program-list" class="program-list"></ol>
            <p id="program-demo" class="program-demo" hidden></p>
          </section>
        </section>
      </div>
      <section class="movement-guide" aria-label="دليل الاتجاهات">
        <h2 id="movement-heading"></h2>
        <ul class="movement-guide__list">
          <li>
            <span class="direction-icon" data-direction="forward" aria-hidden="true">↑</span>
            <span id="move-forward-label"></span>
          </li>
          <li>
            <span class="direction-icon" data-direction="right" aria-hidden="true">→</span>
            <span id="turn-right-label"></span>
          </li>
          <li>
            <span class="direction-icon" data-direction="left" aria-hidden="true">←</span>
            <span id="turn-left-label"></span>
          </li>
        </ul>
      </section>
      <section id="level-error" class="level-error" hidden>
        <p id="level-error-message"></p>
        <div class="level-error__actions">
          <button id="retry-level-button" type="button"></button>
          <button id="return-home-button" type="button"></button>
        </div>
      </section>
      <p id="status" class="status" data-state="idle"></p>
      <section id="level-completion" class="level-completion" hidden aria-live="polite">
        <span class="level-completion__icon" aria-hidden="true">🎉</span>
        <p id="level-completion-message" class="level-completion__message"></p>
      </section>
      <div class="controls" role="group" aria-label="أزرار التحكم">
        <button id="play-button" type="button"></button>
        <button id="stop-button" type="button"></button>
        <button id="reset-button" type="button"></button>
        <button id="next-level-button" type="button" hidden></button>
      </div>
    </main>
  </body>
</html>
