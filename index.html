<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    >
    <title>MiniBot Studio - Robot Lab</title>
    <link rel="stylesheet" href="./css/app.css">
    <script type="module" src="./js/robot-lab.js"></script>
  </head>
  <body>
    <main class="robot-lab" aria-label="مختبر الروبوت">
      <h1>مختبر الروبوت</h1>
      <p id="status" data-state="idle">الحالة: جاهز</p>
      <div class="controls" role="group" aria-label="أزرار التحكم">
        <button id="play-button" type="button">تشغيل</button>
        <button id="stop-button" type="button">إيقاف</button>
        <button id="reset-button" type="button">إعادة</button>
      </div>
    </main>
  </body>
</html>
